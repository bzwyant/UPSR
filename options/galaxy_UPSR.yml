# path
path:
  pretrain_network_g: ~
  # pretrain_network_g: experiments/pretrained_models/upsr.pth
  strict_load_g: true
  resume_state: ~

# training settings
train:
  use_fp16: true
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    # betas: [0.9, 0.9]

  scheduler:
    type: MultiStepLR
    milestones: [15000, 22000]
    gamma: 0.5

  # scheduler:
  #   type: TrueCosineAnnealingLR
  #   T_max: 195000
  #   eta_min: !!float 6e-5

  total_iter: 25000
  warmup_iter: 1000

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    lpips_weight: 0.5

# validation settings
val:
  val_freq: 1000
  suffix: ~
  save_img: true
  pbar: true
  desired_min_size: 64
  # chop_size: ~
  # chop_stride: ~
  chop_bs: 1
  noise_repeat: false

  metrics:
    psnr:
      fr: true

    ssim:
      fr: true

    lpips:
      fr: true
      better: lower
    
    clipiqa:
      fr: false

    musiq:
      fr: false

    # maniqa:
    #   fr: false

    niqe:
      fr: false
      better: lower


# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

