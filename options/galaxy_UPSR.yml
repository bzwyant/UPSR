
# general settings
name: ATD_light_SRx2_galaxy_scratch
model_target: basicsr.models.upsr_real_model.UPSRRealModel
scale: 2
num_gpu: 2
manual_seed: 0
# find_unused_parameters: True
queue_size: 64  #how many preprocessed batches dataloader keeps ready in memory

# dataset and data loader settings
datasets:
  train:
    name: GalaxyMNIST
    type: PairedImageDataset
    dataroot_gt: datasets/galaxy_mnist/train/gt
    dataroot_lq: datasets/galaxy_mnist/train/lq
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    micro_batchsize: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: True
    persistent_workers: True

  val_1:
    name: Set1
    type: PairedImageDataset
    dataroot_gt: datasets/galaxy_mnist/val/gt
    dataroot_lq: datasets/galaxy_mnist/val/lq
    io_backend:
      type: disk

high_order_degradation: false

degradation:
  # gt_usm: True
  scale: 2
  # the first degradation process
  resize_prob: [0.0, 1.0, 0.0]  # up, down, keep
  gaussian_noise_prob: 0.4
  noise_range: [1, 8]
  poisson_scale_range: [0.0, 0.1]
  gray_noise_prob: 0.0
  jpeg_range: [100, 100]  # No JPEG compression

  # Disable second degradation process
  second_order_prob: 0.0
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

  gt_size: 128 
  resize_back: False
  use_sharp: False

# network structures
network_g:
  target: basicsr.archs.swin_unet_arch.UNetModelSwin
  params:
    image_size: 64
    in_channels: 48
    model_channels: 32
    out_channels: 3
    attention_resolutions: [32,16]
    dropout: 0
    channel_mult: [1, 1, 1, 2]
    num_res_blocks: [2, 2, 2, 2]
    conv_resample: True
    dims: 2
    use_fp16: False  # Changed from false otherwise error when context is nullcontext
    num_head_channels: 32
    use_scale_shift_norm: True
    resblock_updown: False
    swin_depth: 2
    swin_embed_dim: 192
    window_size: 8
    mlp_ratio: 4
    cond_lq: True
    lq_size: 64
    num_feat: 128

diffusion:
  un: 0.1
  min_noise: 0.4
  target: models.script_util.create_gaussian_diffusion
  params:
    sf: 2
    schedule_name: exponential
    schedule_kwargs:
      power: 0.2
    etas_end: 0.99
    steps: 5
    min_noise_level: 0.2
    kappa: 2.5
    weighted_mse: False
    predict_type: xstart
    timestep_respacing: ~
    scale_factor: 1.0
    normalize_input: True
    latent_flag: False

network_mse:
  target: basicsr.archs.atd_real_arch.ATD
  ckpt: 
    path: experiments/pretrained_models/ATD_light_SRx2_galaxy.pth
    strict_load_mse: false   # true 
    param_key_mse: params_ema
  params:
    upscale: 2
    in_chans: 3
    img_size: 64
    embed_dim: 32 # reduced from 48
    depths: [4, 4, 4, 4, ]
    num_heads: [4, 4, 4, 4, ]
    window_size: 16
    category_size: 128
    num_tokens: 64
    reducted_dim: 8
    convffn_kernel_size: 7
    img_range: 1.
    mlp_ratio: 1
    upsampler: 'pixelshuffledirect'
    resi_connection: '1conv'
    use_checkpoint: false
    patch_norm: false   # tried adding this with strict_load_mse: true and it failed

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.9]

  scheduler:
    type: MultiStepLR
    milestones: [10000, 20000, 25000]
    gamma: 0.5

  total_iter: 30000
  warmup_iter: 1500

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 2e3
  save_img: true

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 2
      test_y_channel: yes
    
    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 2
      test_y_channel: yes

# logging settings
logger:
  print_freq: 50
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
